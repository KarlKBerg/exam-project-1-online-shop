<!doctype html>
<html lang="en">
  <head>
    <!-- ==== META ==== -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Welcome to ShopMe, your e-commerce site for all your needs! Check out all our products and order today!"
    />
    <!-- ==== ICONS ==== -->
    <script
      src="https://kit.fontawesome.com/b5a5784c82.js"
      crossorigin="anonymous"
    ></script>
    <!-- ==== FONT ==== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- ==== LINKS ==== -->
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="style.css" />
    <!-- ==== TITLE ==== -->
    <title>ShopMe | Home</title>
  </head>
  <body>
    <!-- ==== HEADER ==== -->
    <header>
      <!-- DESKTOP -->
      <!-- Logo -->
      <a href="index.html"
        ><h2 class="logo">Shop<span class="logo-part">Me</span></h2></a
      >
      <!-- Search -->
      <div class="search-container">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" class="search-input" />
      </div>
      <!-- Nav -->
      <nav class="main-nav">
        <a class="nav-item" href="favourites/index.html">
          <i class="fa-regular fa-heart"></i>
          <p class="nav-desc">Favourites</p>
        </a>
        <a class="nav-item" href="account/login.html">
          <i class="fa-regular fa-user"></i>
          <p class="nav-desc">Login</p>
        </a>
        <a class="nav-item" href="cart/cart.html">
          <i class="fa-regular fa-cart-shopping"></i>
          <p class="nav-desc">Shopping</p>
        </a>
      </nav>
      <!-- END DESKTOP -->

      <!-- MOBILE -->
      <!-- Hamburger menu -->
      <a href="" class="hamburger-menu hidden">
        <i class="fa fa-bars"></i>
      </a>
      <!-- END MOBILE -->
    </header>
    <!-- ==== END HEADER ==== -->
    <!-- ==== MAIN ==== -->
    <main>
      <!-- PRODUCT CAROUSEL -->
      <div class="product-carousel">
        <!-- Carousel product #1 -->
        <div class="carousel-product">
          <img src="img/1-perfume-white.jpg" alt="Vanilla perfume bottle" />
          <div class="carousel-product-info">
            <h1>Vanilla perfume</h1>
            <p>
              Women's perfume that smells a warm and sweet, with nuances of wood
              and jasmine.
            </p>
            <a href="#" class="add-to-cart-btn">Add to cart</a>
          </div>
        </div>
      </div>
    </main>
    <!-- ==== END MAIN ==== -->
  </body>
</html>
